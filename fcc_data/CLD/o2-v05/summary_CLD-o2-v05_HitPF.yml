  readme: "ONNX models for the machine-learning particle-flow reconstruction\n(HitPF)\
    \ of k4PFHitML: https://github.com/key4hep/k4PFHitML\n\nBoth models are trained\
    \ on CLD full simulation:\n  - clustering_paper.onnx: condensation/clustering\
    \ model, embeds\n    calorimeter hits and tracks for Density Peak Clustering into\n\
    \    showers. Trained on a Z->uds sample.\n  - energy_correction_paper_neutral.onnx:\
    \ energy regression and PID\n    for neutral showers. Trained on a jet-like particle\
    \ gun sample.\n  - energy_correction_paper_charged_pid.onnx: PID for charged showers.\n\
    \    Trained on a jet-like particle gun sample.\n\nUsed by the PFHitML algorithm\
    \ via the ClusteringModelPath,\nNeutralModelPath and ChargedModelPath properties\
    \ (options/PerformMLPF.py:\n--onnx_model_clustering, --onnx_model_properties_neutral,\n\
    --onnx_model_properties_charged).\n"
