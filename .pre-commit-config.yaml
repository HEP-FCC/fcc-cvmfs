ci:
  autofix_prs: false   # this hook has nothing to auto-fix

repos:
  - repo: local
    hooks:
      - id: validate-fcc-data
        name: Validate FCC data submissions and summary files
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/scripts/process_data.py --dry-run --models-dir fcc_data --base-ref HEAD
        files: ^fcc_data/[^/]+\.yml$
        pass_filenames: true
